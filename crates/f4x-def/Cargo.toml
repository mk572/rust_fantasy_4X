[package]
name = "f4x-def"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
ron.workspace = true
strum.workspace = true
sha2 = { version = "0.11.1", optional = true }

[features]
# `testdir` (a folder of its own for a test, `TestResult`) is for tests only: this crate's unit tests
# have it, the crates above turn it on through their `testutil` feature.
testutil = ["dep:sha2"]

[dev-dependencies]
f4x-def = { path = ".", features = ["testutil"] }
