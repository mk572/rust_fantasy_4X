[package]
name = "f4x-learn"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
f4x-core.workspace = true
f4x-data.workspace = true
hecs.workspace = true
rand.workspace = true
rand_pcg.workspace = true
serde.workspace = true
ron.workspace = true
burn = { version = "0.22", optional = true, default-features = false, features = ["std", "optim", "flex", "simd", "rayon", "metal", "fusion", "autotune"] }

[features]
# The networks and training need the Burn framework; the environment itself does not.
# `spike` is the framework spike of task 169 (`examples/spike.rs`).
train = ["dep:burn"]
spike = ["train"]

[[example]]
name = "spike"
required-features = ["spike"]

[[example]]
name = "train_battle"
required-features = ["train"]

[[example]]
name = "probe"
required-features = ["train"]

[[example]]
name = "make_variants"
required-features = ["train"]

[[example]]
name = "tournament"
required-features = ["train"]
