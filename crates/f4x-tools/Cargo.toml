[package]
name = "f4x-tools"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
f4x-core.workspace = true
f4x-master.workspace = true
f4x-def.workspace = true
serde.workspace = true
ron.workspace = true
f4x-console.workspace = true
f4x-ai.workspace = true
f4x-ai-ref = { workspace = true, optional = true }
f4x-learn = { workspace = true, optional = true, features = ["train"] }

[features]
# The frozen reference AI (`crates/f4x-ai-ref`) for `soak-versus` and a reference roster in `soak`;
# build it through `scripts/ai_battle.py`, which re-forks a stale copy first.
reference = ["dep:f4x-ai-ref"]
# `soak --battle-ai CHECKPOINT`: the AI wizards fight their battles with a trained network.
learned = ["dep:f4x-learn"]

[dev-dependencies]
f4x-def = { workspace = true, features = ["testutil"] }
f4x-core = { workspace = true, features = ["testutil"] }
