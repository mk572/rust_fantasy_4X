[package]
name = "f4x-ai-ref"
edition = "2021"
version = "0.0.4"
license = "CC0-1.0"
build = "build.rs"

[lib]
test = false
doctest = false

[dependencies]
f4x-core = { path = "../f4x-core" }
f4x-def = { path = "../f4x-def" }
f4x-master = { path = "../f4x-master" }
hecs = { version = "0.10", features = ["serde"] }

[dev-dependencies]
f4x-def = { path = "../f4x-def", features = ["testutil"] }
