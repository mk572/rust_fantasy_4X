[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.3"
edition = "2021"
license = "CC0-1.0"

[workspace.dependencies]
hecs = { version = "0.10", features = ["serde"] }
rand = { version = "0.8", default-features = false }
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
macroquad = { version = "0.4", default-features = false, features = ["audio"] }
png = { version = "0.17", default-features = false }
f4x-core = { path = "crates/f4x-core" }
f4x-data = { path = "crates/f4x-data" }
f4x-ai = { path = "crates/f4x-ai" }
f4x-ai-ref = { path = "crates/f4x-ai-ref" }
f4x-console = { path = "crates/f4x-console" }
f4x-learn = { path = "crates/f4x-learn" }

# Build profiles (task 382). Release: link-time optimisation across the crates and one code
# generation unit, slower to build and faster to run (the soak, the client). Debug and tests:
# the workspace crates at level 1 and the dependencies (hecs, serde, ron, rand, macroquad) at
# level 2, so that the tests and a debug client run several times faster than at level 0.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
