# Release: pushing a tag like v0.0.8 builds the Apple silicon packages (docs/installer-design.md 6.5, 7)
# and attaches them to a GitHub release. The tag must equal the version in Cargo.toml.
# The packages carry nothing of the original game. They are signed ad hoc only (no developer account).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos-arm64:
    runs-on: macos-14   # Apple silicon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/mt32-rs, for f4x-music
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/xmi-play
      - name: The tag must equal the version in Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
      - name: Tests
        run: cargo test --workspace --lib --bins --tests
      - name: Build the apps, the dmg and the zip
        run: scripts/make_app.sh --dist
      - name: Checksums
        run: cd target && shasum -a 256 Fantasy4X-*-macos-arm64.dmg Fantasy4X-*-macos-arm64.zip > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --generate-notes \
            --title "Fantasy 4X $GITHUB_REF_NAME" \
            target/Fantasy4X-*-macos-arm64.dmg target/Fantasy4X-*-macos-arm64.zip target/SHA256SUMS.txt
